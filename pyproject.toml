[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "patatt"
dynamic = ["version"]
description = "A simple library to add cryptographic attestation to patches sent via email"
authors = [
    {name = "Konstantin Ryabitsev", email = "mricon@kernel.org"},
]
license = {text = "MIT-0"}
readme = "README.rst"
requires-python = ">=3.8"
keywords = ["git", "patches", "attestation", "email", "workflow"]
classifiers = [
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Communications :: Email",
    "Topic :: Software Development",
]

dependencies = [
    "pynacl>=1.5,<2.0",
]

[dependency-groups]
dev = [
    "mypy",
    "pip-tools",
    "pyright",
    "pytest",
    "ruff",
    "ty",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pip-tools]
generate_hashes = true

[project.urls]
Homepage = "https://git.kernel.org/pub/scm/utils/patatt/patatt.git/about/"
Repository = "https://git.kernel.org/pub/scm/utils/patatt/patatt.git"

[project.scripts]
patatt = "patatt:command"

[tool.setuptools.dynamic]
version = {attr = "patatt.__VERSION__"}

[tool.setuptools.data-files]
"share/man/man5" = ["man/patatt.5"]

[tool.ruff.lint]
extend-select = [
    "F",       # https://docs.astral.sh/ruff/rules/#pyflakes-f
    "B007",    # https://docs.astral.sh/ruff/rules/unused-loop-control-variable/
    "B904",    # https://docs.astral.sh/ruff/rules/raise-without-from-err/
    "DTZ",     # https://docs.astral.sh/ruff/rules/#flake8-datetimez-dtz
    "G",       # https://docs.astral.sh/ruff/rules/#flake8-logging-format-g
    "I",       # https://docs.astral.sh/ruff/rules/#isort-i
    "PERF102", # https://docs.astral.sh/ruff/rules/incorrect-dict-iterator/
    "PGH004",  # https://docs.astral.sh/ruff/rules/blanket-noqa/
    "PIE790",  # https://docs.astral.sh/ruff/rules/unnecessary-placeholder/
    "PIE810",  # https://docs.astral.sh/ruff/rules/multiple-starts-ends-with/
    "RET505",  # https://docs.astral.sh/ruff/rules/superfluous-else-return/
    "RET506",  # https://docs.astral.sh/ruff/rules/superfluous-else-raise/
    "RET507",  # https://docs.astral.sh/ruff/rules/superfluous-else-continue/
    "RET508",  # https://docs.astral.sh/ruff/rules/superfluous-else-break/
    "RUF059",  # https://docs.astral.sh/ruff/rules/unused-unpacked-variable/
    "RUF100",  # https://docs.astral.sh/ruff/rules/unused-noqa/
    "SIM103",  # https://docs.astral.sh/ruff/rules/needless-bool/
    "SIM113",  # https://docs.astral.sh/ruff/rules/enumerate-for-loop/
    "SIM118",  # https://docs.astral.sh/ruff/rules/in-dict-keys/
    "SIM201",  # https://docs.astral.sh/ruff/rules/negate-equal-op/
]
flake8-quotes.inline-quotes = "single"

[tool.ruff.format]
quote-style = "single"

[tool.pyright]
typeCheckingMode = "strict"

# GPGBIN and SSHKBIN are mutable settings despite their uppercase names.
# b4 also assigns GPGBIN directly, so its public name must be preserved.
reportConstantRedefinition = false

executionEnvironments = [
    { root = "tests", reportPrivateUsage = false },
]

# Configure mypy in strict mode
[tool.mypy]
strict = true
warn_unreachable = true

[tool.ty.rules]
all = "error"
# New in ty 0.0.52: flags every method that overrides a base-class method
# without @override. Adopting it would require a typing_extensions dependency
# for the 3.8 fallback (typing.override is 3.12+), which is too much weight
# for a style rule. Revisit if/when the supported Python floor moves to 3.12.
missing-override-decorator = "ignore"

[tool.pytest.ini_options]
testpaths = "tests"
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
log_file = "pytest.log"
log_file_level = "DEBUG"
log_file_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
log_file_date_format = "%Y-%m-%d %H:%M:%S"
addopts = [
    "--import-mode=importlib",
]
